[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "nonconvex-particle-accessibility"
version = "0.2.0"
description = "Accessibility analysis of non-convex 2D particles for granular packing"
requires-python = ">=3.9"
dependencies = ["numpy", "shapely>=2.0", "pandas", "matplotlib"]

[project.optional-dependencies]
mpi = ["mpi4py"]
video = ["opencv-python", "natsort"]
test = ["pytest"]

[tool.setuptools]
packages = ["accessibility"]

[tool.pytest.ini_options]
markers = ["slow: reproduces original research outputs (seconds each)"]
testpaths = ["tests"]
